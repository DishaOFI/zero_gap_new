<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Gap Case Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1b2430; --muted:#667085; --faint:#98a2b3; --line:#e4e7ec;
    --brand:#1f4e79; --brand-soft:#e8eff7; --ok:#067647; --ok-soft:#ecfdf3; --warn:#b54708; --warn-soft:#fffaeb;
    --bad:#b42318; --bad-soft:#fef3f2; --info:#175cd3; --info-soft:#eff8ff;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  button{font:inherit;cursor:pointer}
  /* top bar */
  .top{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(100deg,#15385a 0%,#1f4e79 55%,#2e6fa8 100%);box-shadow:0 4px 14px rgba(16,24,40,.14)}
  .top-in{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;max-width:1440px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;min-width:0}
  .mark{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;flex:none}
  .title{font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap}
  .subtitle{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{display:flex;gap:4px;margin-left:8px;padding:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px}
  .nav a{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:rgba(255,255,255,.8);text-decoration:none;padding:7px 12px;border-radius:9px;white-space:nowrap;transition:background .15s,color .15s}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
  .nav a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.18)}
  .nav svg{width:15px;height:15px;flex:none}
  #navAris.on svg{color:#0f766e} #navZero.on svg{color:#b45309}
  .up{margin-left:12px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#fff;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
  .live{min-width:0;max-width:100%} #liveTxt{overflow:hidden;text-overflow:ellipsis}
  .dot{flex:none}
  .dot{width:8px;height:8px;border-radius:50%;background:#12b76a;box-shadow:0 0 0 0 rgba(18,183,106,.5);animation:pulse 2s infinite}
  .dot.off{background:#fdb022;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.45)}70%{box-shadow:0 0 0 8px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
  /* layout */
  .wrap{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:20px 24px;max-width:1440px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .side{padding:14px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto}
  .side h2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 6px 10px}
  .case{border:1px solid transparent;border-radius:8px;padding:11px 12px;margin-bottom:6px;cursor:pointer;transition:background .15s,border-color .15s}
  .case:hover{background:#f9fafb}
  .case.sel{background:var(--brand-soft);border-color:#c7d7ea}
  .case .n{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .case .m{color:var(--muted);font-size:12px;margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.run{background:var(--info-soft);color:var(--info)} .chip.wait{background:var(--warn-soft);color:var(--warn)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:#f2f4f7;color:var(--muted)}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  /* main */
  .main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .head{padding:20px 24px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .head h1{margin:0;font-size:20px;font-weight:600}
  .head .meta{color:var(--muted);margin-top:4px;font-size:13px}
  .grid2{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
  .sec{padding:20px 24px}
  .sec h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  /* stepper */
  .steps{list-style:none;margin:0;padding:0}
  .step{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
  .step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
  .step.done:not(:last-child)::before{background:#a6d8c0}
  .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:var(--faint);z-index:1}
  .step.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.active .ic{border-color:var(--brand);color:var(--brand)}
  .step.active .ic .spin{width:14px;height:14px}
  .step.error .ic{background:var(--bad);border-color:var(--bad);color:#fff}
  .step .t{font-weight:600;padding-top:3px;display:flex;justify-content:space-between;gap:10px}
  .step.pending .t{color:var(--faint);font-weight:500}
  .step .d{color:var(--muted);font-size:12.5px;margin-top:2px}
  .step.pending .d{display:none}
  .dur{color:var(--faint);font-weight:500;font-size:12px}
  /* summary tiles */
  .sec{container-type:inline-size}
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
  @container (min-width:720px){.tiles.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @container (max-width:719px){.tiles.n3 .tile:last-child{grid-column:span 2}}
  @container (max-width:340px){.tiles{grid-template-columns:1fr}.tiles.n3 .tile:last-child{grid-column:auto}}
  .tile{--tone:var(--brand);--tone-soft:var(--brand-soft);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
  .tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tone)}
  .tile.ok{--tone:var(--ok);--tone-soft:var(--ok-soft)} .tile.warn{--tone:var(--warn);--tone-soft:var(--warn-soft)} .tile.bad{--tone:var(--bad);--tone-soft:var(--bad-soft)}
  .tile .k{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .tile .k i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);flex:none}
  .tile .k svg{width:15px;height:15px}
  .tile .v{font-size:17px;font-weight:700;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
  .tile .v.tone{color:var(--tone)}
  .tile .num{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .tile .num b{font-size:30px;line-height:1;font-weight:700;color:var(--tone);font-variant-numeric:tabular-nums}
  .tile .num span{font-size:12.5px;color:var(--muted);font-weight:500}
  .tile .bar{height:6px;border-radius:999px;background:#f2f4f7;overflow:hidden;margin-top:2px}
  .tile .bar i{display:block;height:100%;border-radius:inherit;background:var(--tone)}
  .tile .s{font-size:12px;color:var(--muted);margin-top:auto}
  .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
  table.kv{width:100%;border-collapse:collapse;margin-bottom:18px}
  table.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
  table.kv td:first-child{color:var(--muted);width:38%}
  .item{border-left:3px solid;padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:8px}
  .item.bad{border-color:var(--bad);background:var(--bad-soft)} .item.warn{border-color:#f79009;background:var(--warn-soft)}
  .item b{margin-right:6px}
  .letter{border:1px solid var(--line);border-radius:8px;background:#fcfcfd;padding:22px 26px;white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.65;max-height:420px;overflow:auto}
  .sub{font-size:13px;font-weight:600;margin:18px 0 8px}
  .note{color:var(--muted);font-size:12.5px}
  /* actions */
  .actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:#fcfcfd;border-radius:0 0 var(--radius) var(--radius);flex-wrap:wrap}
  .btn{white-space:nowrap;border-radius:8px;padding:10px 18px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .btn:hover{background:#f9fafb}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#183f62}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.55;cursor:default}
  /* empty / loader */
  .empty{padding:70px 24px;text-align:center;color:var(--muted)}
  .wheel{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:rot 1s linear infinite}
  .empty h2{color:var(--ink);font-size:17px;margin:0 0 6px}
  .banner{display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:var(--radius);background:var(--brand-soft);border:1px solid #c7d7ea}
  .banner .wheel{width:28px;height:28px;border-width:3px;margin:0}
  .ctl{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .ctl:last-child{border-bottom:0}
  .ctl .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
  .ctl.on .mk{background:var(--ok-soft);color:var(--ok)} .ctl.off .mk{background:var(--bad-soft);color:var(--bad)}
  .ctl .nm{font-weight:600;font-size:13px} .ctl .oc{color:var(--muted);font-size:12.5px;margin-top:1px}
  .ctl.off .oc{color:var(--bad)}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
  .src.aris{background:var(--ok-soft);color:var(--ok)} .src.folder{background:var(--warn-soft);color:var(--warn)}
  .below{display:grid;grid-template-columns:1fr;gap:20px}
  .riskgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
  @media (max-width:1100px){.riskgrid{grid-template-columns:1fr}}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .tl li:last-child{border-bottom:0} .tl .dt{color:var(--muted);font-variant-numeric:tabular-nums}
  .item.info{border-color:var(--info);background:var(--info-soft)}
  .toast{pointer-events:none;position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.2);opacity:0;transform:translateY(10px);transition:all .25s;z-index:20}
  .toast.show{opacity:1;transform:none}
  @media (max-width:1100px){.grid2{grid-template-columns:1fr}}
  @media (max-width:1060px){.top-in{flex-wrap:wrap;height:auto;padding:10px 24px;row-gap:10px}.nav{order:3;margin-left:0;width:100%}.nav a{flex:1;justify-content:center}}
  @media (max-width:820px){.wrap{grid-template-columns:1fr;padding:16px}.side{position:static;max-height:none}.subtitle{display:none}.top-in{padding:10px 16px}}
  @media (max-width:480px){.nav a{padding:7px 6px;font-size:12px;gap:5px}.live{font-size:11px;padding:5px 10px}}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><div class="mark">ZG</div><div><div class="title" data-i18n="brand.title">Care Application Intake</div><div class="subtitle" id="flowLabel" data-i18n="p.workspace">Caseworker workspace</div></div></a>
  <nav class="nav">
    <a href="/portal/aris" id="navAris"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="nav.aris">With ARIS context</span></a>
    <a href="/portal/zero" id="navZero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span data-i18n="nav.zero">Zero context</span></a>
    <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home">Home</span></a>
  </nav>
  <label class="btn up" data-i18n-title="upload.title">⬆ <span data-i18n="upload.new">New application</span><input type="file" id="upload" accept="application/pdf" hidden></label>
  <div class="live"><span class="dot" id="dot"></span><span id="liveTxt" data-i18n="live.connecting">Connecting…</span></div>
  <span class="lang-sw"></span>
</div></header>
<div class="wrap">
  <aside class="card side">
    <h2 data-i18n="p.applications">Applications</h2>
    <div id="list"><div class="note" style="padding:6px" data-i18n="p.noApps">No applications yet.</div></div>
  </aside>
  <main class="main" id="main">
    <div class="card empty"><div class="wheel"></div><h2 data-i18n="p.waitTitle">Waiting for new applications</h2>
      <div data-i18n="p.waitText">As soon as an application arrives by email, its processing appears here live.</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const DEMO = new URLSearchParams(location.search).has('demo');
  const SHOW_CONTROLS = true; // false = hide the 'Risk check' panel
  const POLL_MS = 3000; // one request at a time, every 3 s
  const AGENT = location.pathname.split('/').filter(Boolean).pop() === 'zero' ? 'zero' : 'aris';
  const STATUS_URL = '/api/portal/' + AGENT;
  document.getElementById(AGENT === 'zero' ? 'navZero' : 'navAris').classList.add('on');
  let cases = [], selected = null, known = new Set(), first = true, deciding = {}, lastSig = '';

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const { t } = I18N;
  const fdate = d => d ? esc(I18N.date(d)) : '–';
  const ftime = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString(I18N.locale, {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); };
  // step names come from the server in English; translated by their fixed key
  const stepTitle = s => I18N.has('step.' + s.key) ? t('step.' + s.key) : s.title;
  const stepText = s => I18N.has('step.' + s.key + '.d') ? t('step.' + s.key + '.d') : s.text;
  const appName = c => c.applicant_name ? I18N.tx(c.applicant_name) : t('p.newApp');
  const tx = s => esc(I18N.tx(s));   // text written by the n8n flows, translated for display
  const fdur = ms => !ms ? '' : ms < 1000 ? `${ms} ms` : `${(ms/1000).toFixed(1)} s`;
  const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3500); };

  function chip(c) {
    if (c.decision === 'approved') return `<span class="chip ok">${t('chip.approved')}</span>`;
    if (c.decision === 'rejected') return `<span class="chip bad">${t('chip.rejected')}</span>`;
    if (c.status === 'waiting') return `<span class="chip wait">${t('chip.waiting')}</span>`;
    if (c.status === 'error' || c.status === 'crashed') return `<span class="chip bad">${t('chip.error')}</span>`;
    if (c.status === 'canceled') return `<span class="chip mute">${t('chip.canceled')}</span>`;
    if (c.status === 'success') return `<span class="chip ok">${t('chip.completed')}</span>`;
    return `<span class="chip run"><span class="spin"></span>${t('chip.processing')}</span>`;
  }

  function renderList() {
    if (!cases.length) { $('#list').innerHTML = `<div class="note" style="padding:6px">${t('p.noApps')}</div>`; return; }
    $('#list').innerHTML = cases.map(c => `
      <div class="case ${c.id === selected ? 'sel' : ''}" data-id="${esc(c.id)}">
        <div class="n"><span>${esc(appName(c))}</span>${chip(c)}</div>
        <div class="m">${esc(c.case_ref || c.insurance_number || (c.status === 'error' ? t('p.unreadable') : t('p.reading')))} · ${esc(ftime(c.started_at))}</div>
      </div>`).join('');
    document.querySelectorAll('.case').forEach(el => el.onclick = () => { selected = el.dataset.id; lastSig = ''; render(); });
  }

  function stepIcon(s) {
    if (s.state === 'done') return '<svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M7.6 13.2 4.4 10l-1.2 1.2 4.4 4.4 9.2-9.2-1.2-1.2z"/></svg>';
    if (s.state === 'active') return '<span class="spin"></span>';
    if (s.state === 'error') return '!';
    return '';
  }

  const ICON = {
    result: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    letter: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
  };
  const ico = k => `<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></i>`;
  // working days (Mon–Fri) from a to b, for the "time left" bars
  const workdays = (a, b) => { const d0 = new Date(a), d1 = new Date(b); if (isNaN(d0) || isNaN(d1) || d1 <= d0) return null;
    let n = 0; for (const d = new Date(d0); d < d1; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) n++; return n; };
  const bar = (left, total) => total > 0 && left != null ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, Math.round(left / total * 100)))}%"></i></div>` : '';

  function reviewTiles(r, ready, s) {
    const n = (r.blocking || []).length;
    const left = s.statutory_left, total = workdays(s.start, s.deadline) || Math.max(25, left || 0);
    const it = s.internal;
    const esc_ = r.route === 'escalation';
    const tiles = [
      `<div class="tile ${ready ? 'ok' : 'bad'}"><div class="k">${ico(ready ? 'result' : 'alert')}${t('t.result')}</div>
        <div class="v tone">${ready ? t('t.ready') : t('t.missing')}</div>
        <div class="s">${n ? t(n === 1 ? 't.items1' : 't.itemsN', {n}) : t('t.nothing')}</div></div>`,

  async function decide(c, act, ch) {
    if (act === 'reject' && !confirm(t('d.confirmReject'))) return;
    deciding[c.id] = true; render();
    try {
      if (DEMO) { demoDecide(c.id, act, ch); }
      else { const r = await fetch('/api/runs/' + encodeURIComponent(c.id) + '/decision?decision=' + act + (ch ? '&channel=' + ch : ''), { method: 'POST' }); if (!r.ok) throw new Error((await r.json()).detail || r.statusText); }
      toast(act !== 'approve' ? t('d.toastRejected') : ch === 'print' ? t('d.toastPrint') : ch === 'case_manager' ? t('d.toastCM') : t('d.toastMail'));
    } catch (e) { toast(t('d.failed', {e: e.message})); }
    setTimeout(() => { delete deciding[c.id]; poll(); }, 1200);
  }

  async function poll() {
    try {
      const data = DEMO ? demoData() : await (await fetch(STATUS_URL, { cache: 'no-store' })).json();
      if (data.error) throw new Error(data.error);
      if (data.flow_label) $('#flowLabel').textContent = t('p.workspace') + ' · ' + t('flow.' + AGENT);
      const list = (data.cases || []).slice().sort((a, b) => String(b.started_at).localeCompare(String(a.started_at)));
      const fresh = list.filter(c => !known.has(c.id));
      list.forEach(c => known.add(c.id));
      if (!first && fresh.length) { selected = fresh[0].id; toast(t('p.newReceived')); }
      if (first && !selected && list.length) selected = list[0].id;
      first = false;
      cases = list;
      $('#dot').classList.remove('off');
      $('#liveTxt').textContent = t('live.updated', {t: new Date().toLocaleTimeString(I18N.locale, {hour:'2-digit', minute:'2-digit', second:'2-digit'})});
      // only redraw when something actually changed (keeps scroll position and clicks stable)
      const sig = JSON.stringify([list, selected, deciding]);
      if (sig !== lastSig) { lastSig = sig; render(); }
    } catch (e) {
      $('#dot').classList.add('off');
      $('#liveTxt').textContent = t('live.busy', {e: String(e.message || e).slice(0, 80)});
    }
  }
